<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Tech Shop</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #707070;
            --accent: #2563eb; /* Royal Blue */
            --accent-hover: #1d4ed8;
            --border: #e5e7eb;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        /* --- NAVBAR --- */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .cart-status {
            background-color: var(--text-main);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .cart-status:hover {
            transform: scale(1.05);
        }

        /* --- MAIN HERO --- */
        .hero {
            max-width: 1200px;
            margin: 40px auto 20px;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--text-muted);
        }

        /* --- PRODUCT GRID --- */
        .shop-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: box-shadow 0.3s, transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .image-placeholder {
            width: 100%;
            height: 200px;
            background-color: #f3f4f6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 16px;
        }

        .product-info h3 {
            font-size: 1.15rem;
            margin-bottom: 6px;
        }

        .product-info .price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .add-btn {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .add-btn:hover {
            background-color: var(--accent-hover);
        }

        /* --- RESPONSIVE DESIGNS --- */
        @media (max-width: 600px) {
            .hero h1 { font-size: 2rem; }
            .shop-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR LAYER -->
    <header>
        <div class="nav-container">
            <div class="logo">SwiftShop.</div>
            <div class="cart-status" id="cartWidget">
                Cart: <span id="cartCount">0</span> items
            </div>
        </div>
    </header>

    <!-- BANNER LAYER -->
    <main class="hero">
        <h1>Our Products</h1>
        <p>Handpicked inventory curated by our shop managers.</p>
    </main>

    <!-- PRODUCT DISPLAY GRID -->
    <section class="shop-container" id="productsGrid">
        <!-- JavaScript will automatically inject items here -->
    </section>

    <!-- APP SCRIPT LAYER -->
    <script>
        // 1. Array acting as a placeholder dataset.
        // Later, your Admin panel will add entries directly to this via your database.
        const mockProducts = [
            { id: 1, name: "Minimalist Wireless Keyboard", price: 6500 },
            { id: 2, name: "Ergonomic Optical Mouse", price: 3200 },
            { id: 3, name: "Noise Cancelling Headphones", price: 14500 },
            { id: 4, name: "Ultra-Wide Desktop Monitor", price: 38000 }
        ];

        // 2. Global State Variable to store items chosen by the client
        let globalCart = [];

        // 3. UI Target Reference Elements
        const productsGrid = document.getElementById('productsGrid');
        const cartCountDisplay = document.getElementById('cartCount');

        // 4. Function to render the inventory cards inside the layout container
        function renderInventory() {
            productsGrid.innerHTML = ''; // Clean container before printing
            
            mockProducts.forEach(item => {
                const cardTemplate = `
                    <div class="product-card">
                        <div>
                            <div class="image-placeholder">Product Image</div>
                            <div class="product-info">
                                <h3>${item.name}</h3>
                                <p class="price">KES ${item.price.toLocaleString()}</p>
                            </div>
                        </div>
                        <button class="add-btn" onclick="handleAddToCart(${item.id})">
                            Add to Cart
                        </button>
                    </div>
                `;
                productsGrid.innerHTML += cardTemplate;
            });
        }

        // 5. Logic controller handling adding an item to the cart array
        function handleAddToCart(productId) {
            // Find item corresponding to the button clicked
            const productMatch = mockProducts.find(p => p.id === productId);
            
            if (productMatch) {
                globalCart.push(productMatch);
                updateCartBadge();
            }
        }

        // 6. Action controller modifying UI badges to reflect actual cart arrays
        function updateCartBadge() {
            cartCountDisplay.innerText = globalCart.length;
        }

        // Bootstrapping execution once the file finishes parsing
        renderInventory();
    </script>
</body>
</html>
